services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: chelotext:latest
    container_name: chelotext
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # За HTTPS отвечает nginx на хосте, поэтому cookie только для secure-соединений.
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
    volumes:
      # SQLite, tessdata и секрет сессий живут отдельно от контейнера.
      - chelotext-data:/app/data
      # Корневой PEM НУЦ Минцифры (скачивается скриптом deploy на хосте).
      - ../certs:/app/certs:ro
    ports:
      # Приложение доступно только локально; наружу его публикует nginx.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chelotext-data:
